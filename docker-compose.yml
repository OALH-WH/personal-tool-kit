services:
  gitlab:
    image: gitlab/gitlab-ce:16.5.3-ce.0 
    container_name: gitlab
    restart: always
    hostname: 'oalh.dpdns.org'
    environment:
      GITLAB_RESTORE_INIT: ${GITLAB_RESTORE_INIT}
      GITLAB_RESTORE_FILE: ${GITLAB_RESTORE_FILE}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://$GITLAB_DOMAIN'       # 保持 HTTPS，用于生成外部链接
        gitlab_rails['gitlab_shell_ssh_port'] = 2424

        # 关闭所有重定向
        nginx['redirect_http_to_https'] = false
        registry_nginx['redirect_http_to_https'] = false
        mattermost_nginx['redirect_http_to_https'] = false

        # Nginx 监听设置
        nginx['listen_port'] = 8929
        nginx['listen_https'] = false

        # 修改 proxy_set_headers，动态使用请求中的 X-Forwarded-Proto
        nginx['proxy_set_headers'] = {
          "Host" => "$GITLAB_DOMAIN",
          "X-Forwarded-Proto" => "$$http_x_forwarded_proto",   # 从 Cloudflare 传递的头部获取
          "X-Forwarded-Ssl"   => "off"                        # 取消硬编码的 on
        }
        

        # ---------- 内存关键优化 ----------
        # 减少Puma (Web服务器) 的Worker数量[reference:5]
        puma['worker_processes'] = 2
        
        # 限制单个Puma Worker的最大内存 (MB)，超出会自动重启
        puma['per_worker_max_memory_mb'] = 1024
        
        # 减少Puma的线程数
        puma['min_threads'] = 1
        puma['max_threads'] = 4
        
        # 减少Sidekiq (后台任务) 的并发数[reference:6]
        sidekiq['concurrency'] = 10
        
        # 限制PostgreSQL的缓存大小 (建议设为总内存的25%以下)
        postgresql['shared_buffers'] = "256MB"
        
        # 限制Redis最大内存
        redis['maxmemory'] = "512MB"
        
        # ---------- 关闭非必需服务以释放内存 ----------
        # 关闭内置的监控服务 (Prometheus, Grafana等)
        prometheus_monitoring['enable'] = false
        grafana['enable'] = false
        
        # 关闭其他可能用不到的组件
        alertmanager['enable'] = false
        gitlab_exporter['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false

        # ---------- 其他优化 ----------
        # 减少数据库连接池大小
        gitlab_rails['db_pool'] = 10
    ports:
      - '8929:8929'
      - '443:443'
      - '2424:22'
    volumes:
      - '$GITLAB_HOME/config:/etc/gitlab'
      - '$GITLAB_HOME/logs:/var/log/gitlab'
      - '$GITLAB_HOME/data:/var/opt/gitlab'
      - '${GITLAB_BACKUP_DIR}:/mnt/gitlab/backups'
      - '${GITLAB_RESTORE_DIR}:/mnt/gitlab/restores'
      - '${GITLAB_INIT_TASK_DIR}:/init_tasks'
      - "${GITLAB_CROND_DIR}:/etc/cron.d"
      - "${GITLAB_CRON_TASKS_DIR}:/etc/cron_tasks"
      - "${GITLAB_ENV_DIR}:/env"
    shm_size: '256m'
    mem_limit: '4g'
    memswap_limit: '4g'
    cpus: '4'
    pids_limit: '600'
    command: bash -c "for task in /init_tasks/*;do $$task ; done ; /assets/wrapper"